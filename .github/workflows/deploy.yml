name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "presentations/td3-fonctions/**"
      - ".github/workflows/deploy.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            presentations/td3-fonctions/package-lock.json
      - run: npm ci
      - run: npm run validate
      - name: Install TD3 dependencies
        run: npm ci
        working-directory: presentations/td3-fonctions
      - name: Validate and build TD3
        run: npm run validate
        working-directory: presentations/td3-fonctions
      - name: Add TD3 to the published site
        run: cp -a presentations/td3-fonctions/dist dist/td3-fonctions
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
